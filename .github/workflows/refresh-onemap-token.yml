name: Refresh OneMap token

on:
  schedule:
    # OneMap tokens expire after two days. Refresh on alternating UTC days.
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh Supabase OneMap secret
    runs-on: ubuntu-latest
    steps:
      - name: Request OneMap access token
        id: onemap
        env:
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg email "$ONEMAP_EMAIL" --arg password "$ONEMAP_PASSWORD" \
              '{email:$email,password:$password}')" \
            'https://www.onemap.gov.sg/api/auth/post/getToken')"
          token="$(jq -er '.access_token' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Update Supabase Edge Function secret
        env:
          ONEMAP_TOKEN: ${{ steps.onemap.outputs.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg token "$ONEMAP_TOKEN" \
              '[{name:"ONEMAP_TOKEN",value:$token}]')" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/secrets"
